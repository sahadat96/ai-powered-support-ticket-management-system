name: relay-support

x-api-image: &api-image
  image: relay-support-api:local
  build:
    context: ./backend

x-api-environment: &api-environment
  NODE_ENV: development
  PORT: '4000'
  DATABASE_URL: postgresql://support:${POSTGRES_PASSWORD:-local-compose-only-password}@db:5432/support_desk
  JWT_SECRET: ${JWT_SECRET:?Set a random JWT_SECRET of at least 32 characters in .env}
  FRONTEND_URL: http://localhost:${COMPOSE_WEB_PORT:-3000}
  API_ORIGIN: http://localhost:${COMPOSE_API_PORT:-4000}
  SEED_DEMO: ${SEED_DEMO:-false}
  DEMO_PASSWORD: ${DEMO_PASSWORD:-}

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: support
      POSTGRES_DB: support_desk
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-compose-only-password}
    ports:
      - '${COMPOSE_DATABASE_PORT:-5433}:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U support -d support_desk']
      interval: 5s
      timeout: 5s
      retries: 12

  migrate:
    <<: *api-image
    environment: *api-environment
    depends_on:
      db:
        condition: service_healthy
    command: ['node', 'scripts/migrate.cjs']
    restart: 'no'

  api:
    <<: *api-image
    environment: *api-environment
    depends_on:
      migrate:
        condition: service_completed_successfully
    ports:
      - '${COMPOSE_API_PORT:-4000}:4000'
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:4000/api/v1/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      start_period: 15s
      retries: 6

  web:
    image: relay-support-web:local
    build:
      context: ./frontend
    environment:
      API_URL: http://api:4000
    depends_on:
      api:
        condition: service_healthy
    ports:
      - '${COMPOSE_WEB_PORT:-3000}:3000'

volumes:
  postgres_data:
