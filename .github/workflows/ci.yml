name: Verify application

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: support
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: support_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U support -d support_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://support:ci-only-password@localhost:5432/support_ci
      TEST_DATABASE_URL: postgresql://support:ci-only-password@localhost:5432/support_ci-test
      JWT_SECRET: ci-only-jwt-secret-with-at-least-32-random-characters
      FRONTEND_URL: http://localhost:3000
      API_ORIGIN: http://localhost:4000
      API_URL: http://localhost:4000
      PORT: '4000'
      SEED_DEMO: 'true'
      DEMO_PASSWORD: SupportDemo!2026
      E2E_DEMO_PASSWORD: SupportDemo!2026
      NEXT_PUBLIC_SHOW_DEMO: 'false'
      NEXT_TELEMETRY_DISABLED: '1'
      PLAYWRIGHT_OUTPUT_DIR: test-results
      PLAYWRIGHT_REPORT_DIR: playwright-report
      CI: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            backend/package-lock.json
            frontend/package-lock.json
      - name: Install locked dependencies
        run: |
          npm ci
          npm run setup
      - name: Validate Prisma schema
        working-directory: backend
        run: npx prisma validate
      - name: Create isolated test database
        run: psql "$DATABASE_URL" -c 'CREATE DATABASE "support_ci-test"'
      - name: Migrate both databases and seed the demo
        run: |
          npm run db:migrate
          DATABASE_URL="$TEST_DATABASE_URL" npm run db:migrate
          npm run db:seed
      - name: Check backend types and behavior
        run: |
          npm --prefix backend run typecheck
          npm --prefix backend test
          npm --prefix backend run test:e2e
          npm --prefix backend run ai:evaluate
      - name: Build API and web application
        run: NODE_ENV=production npm run build
      - name: Check frontend types with generated Next.js declarations
        run: npm --prefix frontend run typecheck
      - name: Install Chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Test browser workflows
        run: npm --prefix frontend test
      - name: Preserve browser failure reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-test-reports
          path: |
            frontend/playwright-report
            frontend/test-results
          if-no-files-found: ignore
          retention-days: 7
