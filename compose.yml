services:
  postgres:
    image: postgres:17-alpine
    profiles: [local-db]
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD for the optional Docker database}
      POSTGRES_DB: ai-powered-ticket-management
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - ticket_postgres:/var/lib/postgresql/data
    healthcheck:
      test:
        ['CMD-SHELL', 'pg_isready -U postgres -d ai-powered-ticket-management']
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  ticket_postgres:
